# Where processed data is published.
# Publishing refuses to start while any URL is still a placeholder; --no-publish needs
# none of them. S3 credentials are read from the S3_ACCESS_KEY and S3_SECRET_KEY
# environment variables only.
release: v0.1.0  # the Icechunk tag and Collection suffix: always v<major>.<minor>.<patch>
# Permanent public data URL the STAC asset hrefs name (it redirects to the storage)
data_base_url: YOUR-DATA-BASE-URL
storage:
  endpoint: YOUR-S3-ENDPOINT  # S3 endpoint the processing writes to
  bucket: energybench
  s3_region: us-east-1  # region
stac_api: YOUR-STAC-API-URL  # root of the STAC API (with Transactions)
